server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompression für Text-Inhalte. woff2 und webp sind bereits komprimiert.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Schriften und Bilder ändern sich nur mit neuem Deploy
    location ~* \.(woff2|webp|jpg|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML nie cachen, damit ein Deploy sofort sichtbar ist
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /impressum statt /impressum.html soll ebenfalls funktionieren
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
