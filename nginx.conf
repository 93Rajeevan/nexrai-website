server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next-Bundles und Medien tragen Hash bzw. Version im Namen → dauerhaft cachebar
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location /media/        { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location /fonts/        { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(webp|png|jpg|svg|ico)$ { expires 30d; add_header Cache-Control "public"; access_log off; }

    # HTML nie cachen, damit ein Deploy sofort sichtbar ist
    location ~* \.html$ { expires -1; add_header Cache-Control "no-cache, must-revalidate"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Alte Adressen der Single-File-Seite (v7) auf die neuen umleiten,
    # damit Links und Suchtreffer nicht ins Leere laufen.
    location = /nexrai-potenzialrechner.html { return 301 /potenzialrechner; }

    # /about → about.html (statischer Export von Next.js)
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}
